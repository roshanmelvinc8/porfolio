<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
        <p><a href="#" onclick="showForgotPassword(); return false;">Forgot Password?</a></p>
        <p id="error"></p>

        <div id="forgot-password-form" class="forgot-password-form">
            <h3>Reset Password</h3>
            <input type="password" id="newPassword" placeholder="Set New Password">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password">
            <button type="button" onclick="resetPassword()">Reset Password</button>
            <p id="reset-message"></p>
            <a href="#" onclick="hideForgotPassword(); return false;">Back to Login</a>
        </div>
    </div>

    <script src="folio.js"></script>
</body>
</html>
